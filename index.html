<style>
/* Layout: one-column phone app. Header + month switcher, scrolling content, fixed bottom tab bar, floating add button, bottom sheet for forms. */

}

  --bg:#0D1513; --surface:#16211F; --ink:#E8F0EE; --muted:#93A5A1; --line:#26352F;
  --accent:#3CC3AE; --accent-ink:#05211C; --accent-soft:#17332E;
  --rafa:#86A2FF; --rebe:#F58BB6; --good:#4CC27F; --bad:#FF8A78; --warn:#E3AE5C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1513; --surface:#16211F; --ink:#E8F0EE; --muted:#93A5A1; --line:#26352F;
  --accent:#3CC3AE; --accent-ink:#05211C; --accent-soft:#17332E;
  --rafa:#86A2FF; --rebe:#F58BB6; --good:#4CC27F; --bad:#FF8A78; --warn:#E3AE5C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}

  padding-block:8px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}

  padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:90%;text-align:center}

.rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.mini{flex:none;min-height:40px;padding:0 16px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px}
.lk{text-align:left;color:inherit}

.who2{display:flex;align-items:center;gap:10px;padding:6px 0}

.hist{width:100%;height:auto;display:block}

.hist .sv{fill:var(--ink);font:600 11px var(--f-body)}
.hist .sl{fill:var(--muted);font:500 11px var(--f-body)}
.card.note{background:var(--accent-soft);color:var(--ink);font-size:14px;font-weight:600}
.ib{position:relative;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);font:700 12px/1 var(--f-body);font-style:italic;vertical-align:middle;margin-left:4px;padding:0;flex:none}
.ib::before{content:"";position:absolute;inset:-12px}
#pop .popc{position:fixed;z-index:70;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 84px);max-width:540px;margin:0 auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:8px}
#pop .popc b{font-family:var(--f-display);font-size:17px}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}

.chipb{flex:none;min-height:36px;padding:0 12px;border-radius:999px;background:var(--bg);color:var(--ink);font-size:14px;font-weight:600;white-space:nowrap}

.datebox{display:flex;gap:8px;align-items:center}

.pvl>span:first-child{display:flex;align-items:center;gap:6px;min-width:0}

<div class="wrap" id="app"></div>
<button class="fab" id="fab" aria-label="Agregar movimiento"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script>
const SEED=/*SEED*/null;
const KEY='gastos-pareja-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MX=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'});
const MX0=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
const money=n=>MX.format(n||0), money0=n=>MX0.format(Math.round(n||0));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addM=(d,n)=>new Date(d.getFullYear(),d.getMonth()+n,d.getDate());
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};
const fmtDay=d=>d.toLocaleDateString('es-MX',{day:'numeric',month:'short'}).replace('.','');
const fmtLong=d=>d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
const monthKey=s=>s.slice(0,7);

/* ---------- estado ---------- */
let S=null;
let memoryOnly=false;
function clone(o){return JSON.parse(JSON.stringify(o))}
function emptyState(){return {reg:[],deb:[],cre:[],msi:[],casa:[],pctCasa:0.572,pctShared:0.5,planV:3}}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&o.reg)return o}}catch(e){memoryOnly=true}
  return emptyState();
}
function save(){persist()}
S=load();

/* ---------- lógica ---------- */
const CASA_CONCEPTOS=['TOTALPLAY','PRIME','RENTA'];
const accounts=()=>[...S.deb.map(a=>a.n),...S.cre.map(a=>a.n),'EFECTIVO'];
function titular(acc){
  const d=S.deb.find(x=>x.n===acc); if(d) return d.tit;
  const c=S.cre.find(x=>x.n===acc); if(c) return c.tit;
  return 'AMBOS';
}
function pctOf(r){return CASA_CONCEPTOS.includes(r.c)?S.pctCasa:S.pctShared}
function parts(r){
  if(r.t!=='GASTO') return [0,0];
  const t=titular(r.a);
  if(r.s==='NO'){ const w=r.de||t; if(w==='REBE') return [0,r.m]; if(w==='RAFA') return [r.m,0]; }
  const p=pctOf(r); return [r.m*p,r.m*(1-p)];
}
function owner(r){
  if(r.t==='GASTO'){const [a,b]=parts(r); return a&&b?'AMBOS':(a?'RAFA':'REBE')}
  const t=titular(r.a); return t;
}
function saldo(acc){
  const a=S.deb.find(x=>x.n===acc.n||x===acc); let v=a.ini||0;
  for(const r of S.reg){ if(r.a!==a.n) continue;
    if(r.t==='GASTO') v-=r.m; else v+=r.m; }
  return v;
}
function cycle(dateStr,card){
  if(!card||!card.corte||!card.pago) return null;
  const d=parse(dateStr); let cm=d.getMonth(); if(d.getDate()>card.corte) cm++;
  const corte=new Date(d.getFullYear(),cm,card.corte);
  const pago=new Date(d.getFullYear(),cm+(card.pago<card.corte?1:0),card.pago);
  return {corte,pago};
}
function msiInfo(m){
  const card=S.cre.find(c=>c.n===m.t); const cy=cycle(m.f,card);
  const first=m.primer?parse(m.primer):(cy?cy.pago:addM(parse(m.f),1)); const mens=m.m/m.meses; const t=today();
  let hechos=0; for(let k=0;k<m.meses;k++){ if(addM(first,k)<=t) hechos++; }
  const last=addM(first,m.meses-1);
  const sharedNo=m.s==='NO'; const tit=titular(m.t);
  let rafa=mens/2, rebe=mens/2;
  if(sharedNo){ if(tit==='RAFA'){rafa=mens;rebe=0} else if(tit==='REBE'){rafa=0;rebe=mens} }
  return {first,mens,hechos,faltan:m.meses-hechos,last,rest:m.m-mens*hechos,rafa,rebe};
}
function upcoming(days){
  const t=today(), lim=new Date(t.getFullYear(),t.getMonth(),t.getDate()+days);
  const map={};
  const add=(card,date,key,v,pr,pb)=>{const k=card+'|'+ymd(date);(map[k]=map[k]||{card,date,g:0,msi:0,rafa:0,rebe:0})[key]+=v;map[k].rafa+=pr;map[k].rebe+=pb};
  for(const r of S.reg){ if(r.t!=='GASTO') continue; const card=S.cre.find(c=>c.n===r.a); if(!card) continue;
    const cy=cycle(r.f,card); if(!cy) continue; const [pr,pb]=parts(r); add(card.n,cy.pago,'g',r.m,pr,pb); }
  for(const m of S.msi){ const card=S.cre.find(c=>c.n===m.t); const i=msiInfo(m);
    for(let k=0;k<m.meses;k++){ const d=addM(i.first,k); add(card?card.n:m.t,d,'msi',i.mens,i.rafa,i.rebe); } }
  const out=Object.values(map).filter(x=>x.date>=t&&x.date<=lim).map(x=>({kind:'card',date:x.date,title:'Pago '+x.card,total:x.g+x.msi,rafa:x.rafa,rebe:x.rebe,note:x.msi?('incluye '+money0(x.msi)+' de MSI'):''}));
  for(const c of (S.fijos||[])){ if(!c.m||!c.dia) continue; for(let k=0;k<3;k++){ const d=new Date(t.getFullYear(),t.getMonth()+k,c.dia); if(d>=t&&d<=lim){ out.push({kind:'casa',date:d,title:cap(c.c),total:c.m,rafa:0,rebe:0,note:'gasto fijo'}); break } } }
  return out.sort((a,b)=>a.date-b.date);
}
const cap=s=>s?s.charAt(0)+s.slice(1).toLowerCase():s;

/* ---------- UI state ---------- */
const now=today();
const ui={tab:'resumen',y:now.getDate()>12?new Date(now.getFullYear(),now.getMonth()+1,1).getFullYear():now.getFullYear(),m:now.getDate()>12?(now.getMonth()+1)%12:now.getMonth(),filter:'TODOS',acc:'',q:'',sheet:null,confirm:false,toast:''};

const CORTE=12; /* periodo = del 13 al 12, como el corte de las tarjetas BBVA */
function periodo(y,m){ return {start:new Date(y,m-1,CORTE+1), end:new Date(y,m,CORTE)} }
function periodoDe(ds){ const d=parse(ds); const n=d.getDate()>CORTE?new Date(d.getFullYear(),d.getMonth()+1,1):d; return [n.getFullYear(),n.getMonth()] }
const periodoRango=(y,m)=>{const p=periodo(y,m); return fmtDay(p.start)+' – '+fmtDay(p.end)};
const monthStr=()=>ui.y+'-'+pad(ui.m+1);
const monthLabel=()=>{const l=new Date(ui.y,ui.m,1).toLocaleDateString('es-MX',{month:'long',year:'numeric'});return l.charAt(0).toUpperCase()+l.slice(1)};
const monthRows=()=>{const p=periodo(ui.y,ui.m),a=ymd(p.start),b=ymd(p.end); return S.reg.filter(r=>r.f>=a&&r.f<=b)};

const ICON={
  resumen:'<path d="M4 13h4v7H4zM10 4h4v16h-4zM16 9h4v11h-4z"/>',
  movs:'<path d="M5 7h14M5 12h14M5 17h9"/>',
  cuentas:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M7 15h3"/>',
  msi:'<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',
  claras:'<path d="M4 8h14l-3.5-3.5M20 16H6l3.5 3.5"/>',
  ajustes:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>'
};
const TABS=[['resumen','Mes'],['movs','Registro'],['claras','A mano'],['cuentas','Cuentas'],['msi','MSI'],['ajustes','Ajustes']];

/* ---------- vistas ---------- */
function monthNav(title){
  return `<div class="top"><h1>${title}</h1><div class="month"><button data-a="prev" aria-label="Mes anterior">‹</button><span>${esc(periodoRango(ui.y,ui.m))}</span><button data-a="next" aria-label="Mes siguiente">›</button></div></div>`;
}
function chipFor(x){
  const o=owner(x);
  if(x.t==='GASTO') return o==='AMBOS'?'<span class="chip a">Compartido</span>':(o==='RAFA'?'<span class="chip r">Rafa</span>':'<span class="chip b">Rebe</span>');
  return o==='RAFA'?'<span class="chip r">Rafa</span>':(o==='REBE'?'<span class="chip b">Rebe</span>':'<span class="chip">Ambos</span>');
}
function accOpts(sel){
  const usadas=new Set(S.reg.map(r=>r.a).filter(Boolean)), cre=S.cre.map(c=>c.n), deb=S.deb.map(d=>d.n);
  const otras=[...usadas].filter(a=>!cre.includes(a)&&!deb.includes(a)).sort();
  const o=l=>l.map(a=>`<option value="${esc(a)}" ${a===sel?'selected':''}>${esc(a)}</option>`).join('');
  return `<optgroup label="Tarjetas de crédito">${o(cre)}</optgroup><optgroup label="Cuentas">${o(deb)}</optgroup>${otras.length?`<optgroup label="Otras">${o(otras)}</optgroup>`:''}`;
}
function accResumen(acc,esCard,rows){
  let cargos=0, abonos=0;
  for(const x of rows){
    if(esCard&&x.c==='PAGO '+acc&&x.a!==acc){abonos+=Math.abs(x.m);continue}
    if(x.t==='GASTO') cargos+=x.m; else if(x.m<0) cargos+=-x.m; else abonos+=x.m;
  }
  let msi=0, nm=0;
  if(esCard){ try{ const P=monthPlan(ui.y,ui.m); for(const x of P.msi) if(x.x.t===acc){msi+=x.i.mens;nm++} }catch(e){} }
  return `<section class="card"><div class="flow">
    ${flowRow(esCard?'Compras y cargos':'Salidas',cargos,'','')}
    ${esCard&&msi?flowRow('Mensualidades MSI ('+nm+')',msi,'',''):''}
    ${flowRow(esCard?'Pagos a la tarjeta':'Entradas',abonos,'','')}
  </div><span class="sub">${rows.length} movimiento${rows.length===1?'':'s'} del ${esc(periodoRango(ui.y,ui.m))}${esCard&&msi?'. Los MSI no aparecen en la lista, se cobran solos en el corte.':''}</span></section>`;
}
function vMovs(){
  let rows=monthRows().sort((a,b)=>b.f.localeCompare(a.f)||String(b.id).localeCompare(String(a.id)));
  const q=ui.q.trim().toLowerCase();
  if(ui.filter!=='TODOS'){
    rows=rows.filter(x=>{const o=owner(x);return ui.filter==='COMPARTIDO'?o==='AMBOS':(o===ui.filter||(o==='AMBOS'&&x.t==='GASTO'&&parts(x)[ui.filter==='RAFA'?0:1]>0&&false))});
  }
  const acc=ui.acc||'', esCard=S.cre.some(c=>c.n===acc);
  if(acc) rows=rows.filter(x=>x.a===acc||(esCard&&x.c==='PAGO '+acc));
  if(q) rows=rows.filter(x=>(x.c+' '+x.k+' '+x.a+' '+(x.n||'')).toLowerCase().includes(q));
  const groups={}; rows.forEach(x=>(groups[x.f]=groups[x.f]||[]).push(x));
  const F=[['TODOS','Todos'],['RAFA','Rafa'],['REBE','Rebe'],['COMPARTIDO','Compartidos']];
  return `<div class="wrap">${monthNav('Movimientos')}
  <div class="seg" role="group" aria-label="Filtro">${F.map(([k,l])=>`<button data-a="filter" data-v="${k}" aria-pressed="${ui.filter===k}">${l}</button>`).join('')}</div>
  <div class="fbar"><select id="facc" aria-label="Cuenta o tarjeta"><option value="">Todas las cuentas y tarjetas</option>${accOpts(acc)}</select></div>
  <input id="q" type="search" placeholder="Buscar concepto, categoría o cuenta" value="${esc(ui.q)}" autocomplete="off">
  ${acc?accResumen(acc,esCard,rows):''}
  ${rows.length?Object.keys(groups).map(d=>`<div class="day">${esc(fmtLong(parse(d)))}</div><section class="card" style="padding:4px 16px"><div class="list">${groups[d].map(x=>`<button class="item" data-a="edit" data-id="${esc(x.id)}"><div class="main"><b>${esc(x.c||'Sin concepto')}</b><span class="sub">${esc((x.k||'').toLowerCase())} · ${esc(x.a)}${x.por?' · por '+esc(cap(x.por)):''}</span></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="amt ${x.t==='GASTO'?'':(x.m>=0?'pos':'neg')}">${x.t==='GASTO'?'−':(x.m>=0?'+':'')}${money(Math.abs(x.m))}</span>${chipFor(x)}</div></button>`).join('')}</div></section>`).join(''):`<section class="card empty"><b>Nada por aquí</b>${q||acc||ui.filter!=='TODOS'?'Prueba con otro filtro.':'Registra un gasto con el botón +.'}</section>`}
  </div>`;
}
function vCuentas(){
  const groups=['RAFA','REBE','AMBOS'];
  const RS={}; (typeof rendTodas==='function'?rendTodas():[]).forEach(x=>{RS[x.acc.n]=x.tot});
  const deb=S.deb.map(a=>({a,s:Math.round((saldo(a)+(RS[a.n]||0))*100)/100+0,est:RS[a.n]||0}));
  const total=deb.reduce((t,x)=>t+x.s,0);
  const up=upcoming(45);
  const nextOf=n=>up.find(u=>u.kind==='card'&&u.title==='Pago '+n);
  const up30=upcoming(30).slice(0,8);
  return `<div class="wrap"><div class="top"><h1>Cuentas</h1></div>
  <section class="card"><h2>Próximos pagos ${infoI('proximos')}</h2><span class="sub" style="margin-top:-8px">Siguientes 30 días: tarjetas (con MSI) y gastos fijos</span>
  ${up30.length?`<div class="list">${up30.map(u=>`<div class="item"><div class="main"><b>${esc(u.title)}</b><span class="sub">${fmtDay(u.date)}${u.note?' · '+esc(u.note):''}</span></div><span class="amt">${money0(u.total)}</span></div>`).join('')}</div>`:`<div class="empty">No hay pagos próximos.</div>`}</section>
  <section class="card hero"><span class="sub">Dinero disponible en débito</span><div class="big">${money0(total)}</div><span class="sub">Calculado con el saldo inicial y tus movimientos</span></section>
  ${groups.map(g=>{const l=deb.filter(x=>x.a.tit===g);if(!l.length)return'';return `<section class="card"><h2>${g==='AMBOS'?'De los dos':cap(g)} ${infoI('debito')}</h2><div class="list">${l.map(x=>`<div class="item"><span class="dot" style="background:${g==='RAFA'?'var(--rafa)':g==='REBE'?'var(--rebe)':'var(--accent)'}"></span><div class="main"><b>${esc(x.a.n)}</b>${(typeof apartados==='function'?apartados(x.a,x.s):[]).map(p=>`<span class="sub apt-l"><span>${esc(p.n)} · ${p.t}%</span><span>${money(p.m)}</span></span>`).join('')}${x.est>0.005?`<span class="sub">Incluye ~${money(x.est)} de rendimiento estimado</span>`:''}</div><span class="amt ${x.s<0?'neg':''}">${money(x.s)}</span></div>`).join('')}</div></section>`}).join('')}
  <section class="card"><h2>Tarjetas de crédito ${infoI('tarjetas')}</h2><div class="list">${S.cre.map(c=>{const n=nextOf(c.n);return `<div class="item"><div class="main"><b>${esc(c.n)}</b><span class="sub">${c.corte?'Corte día '+c.corte+' · pago día '+c.pago:'Sin fechas de corte'}</span></div><div style="text-align:right"><span class="amt">${n?money0(n.total):'—'}</span><div class="sub">${n?'el '+fmtDay(n.date):'sin pago próximo'}</div></div></div>`}).join('')}</div></section></div>`;
}
function vMsi(){
  const t=today(), info=S.msi.map(m=>({m,i:msiInfo(m)}));
  const [py,pm]=periodoDe(ymd(t)), P=monthPlan(py,pm);
  const [ny,nm]=(()=>{const d=new Date(py,pm+1,1);return [d.getFullYear(),d.getMonth()]})(), N=monthPlan(ny,nm);
  const act=info.filter(x=>x.i.faltan>0&&x.i.first<=t).sort((a,b)=>a.i.last-b.i.last);
  const fut=info.filter(x=>x.i.faltan>0&&x.i.first>t).sort((a,b)=>a.i.first-b.i.first);
  const fin=info.filter(x=>x.i.faltan<=0);
  const rest=[...act,...fut].reduce((s,x)=>s+x.i.rest,0);
  const ROW=({m,i})=>`<button class="item" style="flex-direction:column;align-items:stretch;gap:8px" data-a="msiedit" data-i="${S.msi.indexOf(m)}"><div style="display:flex;justify-content:space-between;gap:12px"><div class="main"><b>${esc(cap(m.c))}</b><span class="sub">${esc(m.t)} · ${m.s==='NO'?'solo '+cap(titular(m.t)):'compartido'}</span></div><div style="text-align:right"><span class="amt">${money0(i.mens)}</span><div class="sub">por mes</div></div></div><div class="prog"><i style="width:${i.hechos/m.meses*100}%"></i></div><div style="display:flex;justify-content:space-between" class="sub"><span>${i.hechos?i.hechos+' de '+m.meses+' pagos':'Empieza a pagarse '+fmtDay(i.first)+' '+i.first.getFullYear()}</span><span>${i.faltan>0?'Termina '+i.last.toLocaleDateString('es-MX',{month:'short',year:'numeric'}).replace('.',''):'Liquidado'}</span></div></button>`;
  const sec=(titulo,sub,l)=>l.length?`<section class="card"><h2>${titulo}</h2>${sub?`<span class="sub" style="margin-top:-8px">${sub}</span>`:''}<div class="list">${l.map(ROW).join('')}</div></section>`:'';
  return `<div class="wrap"><div class="top"><h1>Meses sin intereses</h1></div>
  <section class="card hero"><span class="sub">Mensualidades de este periodo (${esc(periodoRango(py,pm))}) ${infoI('msi-tab')}</span><div class="big">${money0(P.tMsi)}</div>
    <span class="sub">Siguiente periodo (${esc(periodoRango(ny,nm))}): ${money0(N.tMsi)} · Quedan por pagar ${money0(rest)} en ${act.length+fut.length} compra${act.length+fut.length===1?'':'s'}</span></section>
  ${sec('Activas','Ya se están cobrando',act)}
  ${sec('Por empezar','Compradas, pero el primer pago todavía no llega',fut)}
  ${sec('Liquidadas','',fin)}
  ${info.length?'':`<section class="card empty"><b>Sin compras a meses</b>Agrega una para ver cuánto queda por pagar.</section>`}
  <button class="btn" data-a="msinew">Agregar compra a MSI</button></div>`;
}

const num=s=>{const n=parseFloat(String(s).replace(/[^0-9.\-]/g,''));return isNaN(n)?NaN:n};
/* ---------- captura de movimientos (reglas del Excel) ---------- */
const PAGO_CATS=['PAGO','TARJETAS'];
const isPago=r=>PAGO_CATS.includes(r.k);
const NOTES=['REBE PAGÓ','RAFA PAGÓ','REBE DEBE'];
const TIPOS=[['GASTO','Gasto'],['INGRESO','Ingreso'],['REEMBOLSO','Reembolso'],['TRANSFERENCIA','Transferencia'],['PAGO','Pago de tarjeta']];
const debObj=n=>S.deb.find(a=>a.n===n);
const DE=[['SÍ','Compartido'],['RAFA','Solo Rafa'],['REBE','Solo Rebe']];
function deVal(d){ if(d.s!=='NO') return 'SÍ'; const w=d.de||titular(d.a); return w==='AMBOS'?'SÍ':w }

/* El monto acepta sumas como en el Excel: 454+476 */
function evalAmount(s){
  s=String(s||'').replace(/,/g,'').trim(); if(!s) return NaN;
  if(!/^[0-9+\-*/.()\s]+$/.test(s)) return NaN;
  try{const v=Function('"use strict";return ('+s+')')();return isFinite(v)?Math.round(v*100)/100:NaN}catch(e){return NaN}
}
function histRows(T){return S.reg.filter(r=>T==='GASTO'?(r.t==='GASTO'&&!isPago(r)):r.t===T)}
function topBy(rows,key,filter,n){
  const cnt={},last={}; rows.forEach((r,i)=>{const k=r[key]; if(!k) return; cnt[k]=(cnt[k]||0)+1; last[k]=i});
  const f=(filter||'').toLowerCase();
  return Object.keys(cnt).filter(k=>!f||k.toLowerCase().includes(f)).sort((a,b)=>cnt[b]-cnt[a]||last[b]-last[a]).slice(0,n);
}
function defaultAcc(T){
  let rows=S.reg.filter(r=>r.t===(T==='PAGO'?'GASTO':T)&&(T!=='PAGO'||isPago(r)));
  if(ui.yo){const mine=rows.filter(r=>r.por===ui.yo||titular(r.a)===ui.yo); if(mine.length) rows=mine}
  const l=rows.length?rows[rows.length-1].a:null;
  const ok=T==='GASTO'?accounts():[...S.deb.map(a=>a.n),'EFECTIVO'];
  return ok.includes(l)?l:ok[0];
}
function newData(T,keep){
  const a=defaultAcc(T);
  return Object.assign({f:ymd(today()),c:'',k:'',m:'',a,a2:'',card:(S.cre[0]||{}).n||'',s:'SÍ',n:''},keep||{});
}
function openSheet(row,pre){
  ui.sheet=pre?{kind:'mov',edit:false,id:null,t:pre.t,confirm:false,touched:{a:true,s:true},kAuto:'',d:newData(pre.t,pre.d)}:row?{kind:'mov',edit:true,id:row.id,t:row.t,confirm:false,touched:{a:true,s:true},kAuto:'',d:Object.assign(newData(row.t),clone(row),{m:String(row.m),n:row.n||''})}
              :{kind:'mov',edit:false,id:null,t:'GASTO',confirm:false,touched:{a:false,s:false},kAuto:'',d:newData('GASTO')};
  renderSheet();
}
function stamp(r){ r.ts=Date.now(); if(ui.yo) r.por=ui.yo; return r }
function opt(n,val){return `<option value="${esc(n)}" ${n===val?'selected':''}>${esc(n)}</option>`}
function selHtml(id,groups,val){
  if(!groups.some(([,l])=>l.includes(val))&&val) groups=[...groups,['Otras',[val]]];
  return `<select id="${id}">${groups.map(([g,l])=>`<optgroup label="${esc(g)}">${l.map(n=>opt(n,val)).join('')}</optgroup>`).join('')}</select>`;
}
function sheetMov(){
  const sh=ui.sheet,T=sh.t,d=sh.d,edit=sh.edit;
  const kind=(T==='TRANSFERENCIA'&&!edit)?'transfer':(T==='PAGO'?'pago':'std');

  const ag=T==='GASTO'?[...dg,['Tarjetas de crédito',S.cre.map(c=>c.n)]]:dg;
  const accLabel=T==='GASTO'?'Pagado con':(T==='INGRESO'||T==='REEMBOLSO'?'Entra a':'Cuenta');

  if(kind==='transfer'){
    body=`<div class="two"><div class="field"><label for="a">De</label>${selHtml('a',dg,d.a)}</div><div class="field"><label for="a2">A</label>${selHtml('a2',dg,d.a2||dg[0][1].find(n=>n!==d.a))}</div></div>`;
  }else if(kind==='pago'){
    body=`<div class="two"><div class="field"><label for="a">Pagas con</label>${selHtml('a',dg,d.a)}</div><div class="field"><label for="card">Tarjeta</label>${selHtml('card',[['Tarjetas',S.cre.map(c=>c.n)]],d.card)}</div></div>`;
  }else{
    body=`<div class="field"><label for="c">Concepto</label><input id="c" placeholder="Ej. Chedraui, Uber" value="${esc(d.c)}" autocomplete="off" autocapitalize="characters"><div class="chips" id="cchips"></div></div>
    <div class="field"><label for="k">Categoría</label><input id="k" placeholder="Ej. despensa" value="${esc(d.k)}" autocomplete="off" autocapitalize="characters"><div class="chips" id="kchips"></div></div>
    <div class="field"><label for="a">${accLabel}</label>${selHtml('a',ag,d.a)}</div>`;
  }
  return `<div class="scrim" data-a="closeSheet"><form class="sheet" id="f" novalidate>
  <header><h2>${edit?'Editar movimiento':'Nuevo movimiento'}</h2><button type="button" class="x" data-a="closeSheet" aria-label="Cerrar">✕</button></header>
  ${edit?'':`<div class="seg" role="group" aria-label="Tipo">${TIPOS.map(([k,l])=>`<button type="button" data-a="tipo" data-v="${k}" aria-pressed="${T===k}">${l}</button>`).join('')}</div>`}
  <div class="field"><label for="m">Monto</label><input class="amount" id="m" inputmode="decimal" enterkeyhint="done" placeholder="0.00" value="${esc(d.m)}" autocomplete="off"><div class="sub calc" id="mcalc"></div></div>
  ${body}
  <div class="field"><label for="f_">Fecha</label><div class="datebox"><input id="f_" type="date" value="${esc(d.f)}"><button type="button" class="chipb" data-a="dchip" data-v="0">Hoy</button><button type="button" class="chipb" data-a="dchip" data-v="1">Ayer</button></div></div>
  ${T==='GASTO'&&kind==='std'?`<div class="field"><label>¿De quién es?</label><input type="hidden" id="s" value="${esc(deVal(d))}"><div class="seg" id="deseg">${DE.map(([k,l])=>`<button type="button" data-a="de" data-v="${k}" aria-pressed="${deVal(d)===k}">${l}</button>`).join('')}</div><small class="sub" id="snote"></small></div>`:''}
  <div class="field"><label for="n">Nota (opcional)</label><input id="n" value="${esc(d.n||'')}" autocomplete="off"><div class="chips">${NOTES.map(x=>`<button type="button" class="chipb" data-a="nchip" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>
  <div class="pv" id="pv" aria-live="polite"></div>
  <div class="btns"><button type="submit" class="btn">Guardar</button>${edit?`<button type="button" class="btn ${sh.confirm?'danger':'ghost'}" data-a="del">${sh.confirm?'Confirmar eliminar':'Eliminar'}</button>`:`<button type="button" class="btn ghost" data-a="another">Guardar y otro</button>`}</div>
  </form></div>`;
}
function formVals(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:''}; const se=document.getElementById('s'); const sv=se?se.value:'';

}
function chipsHtml(list,action,cur){
  return list.map(x=>`<button type="button" class="chipb" data-a="${action}" data-v="${esc(x)}" aria-pressed="${x===cur}">${esc(cap(x))}</button>`).join('');
}
const balLine=(n,delta)=>{const a=debObj(n); if(!a) return ''; const b=saldo(a),c=b+delta;
  return `<div class="pvl"><span>${esc(n)}</span><span>${money0(b)} → <b class="${c<0?'neg':''}">${money0(c)}</b></span></div>`};
function previewHtml(sh,v,amt){
  const T=sh.t; if(!(amt>0)&&!(sh.edit&&!isNaN(amt)&&amt!==0)) return '<span class="sub">Escribe el monto para ver cómo se va a registrar.</span>';
  const L=[]; const abs=Math.abs(amt);
  if(T==='GASTO'){
    const row={t:'GASTO',c:v.c,m:abs,a:v.a,s:v.s,de:v.de}; const [pr,pb]=parts(row); const tt=titular(v.a);
    const casa=CASA_CONCEPTOS.includes(v.c); const p=pctOf(row);
    let why; if(v.s==='NO'){ why='Todo es de '+cap(v.de||tt); if(v.de&&tt!=='AMBOS'&&tt!==v.de) why+=', aunque se pagó con cuenta de '+cap(tt); } else why='Reparto '+(p*100).toFixed(1)+'% Rafa / '+((1-p)*100).toFixed(1)+'% Rebe'+(casa?' (porcentaje de casa)':'');
    L.push(`<div class="pvl"><span><span class="dot" style="background:var(--rafa)"></span> Rafa</span><b>${money(pr)}</b></div><div class="pvl"><span><span class="dot" style="background:var(--rebe)"></span> Rebe</span><b>${money(pb)}</b></div><div class="sub">${esc(why)}</div>`);
    const card=S.cre.find(c=>c.n===v.a);
    if(card){ const cy=v.f?cycle(v.f,card):null;
      L.push(cy?`<div class="pvl"><span>Corta el ${fmtDay(cy.corte)}</span><span>se paga el <b>${fmtDay(cy.pago)}</b></span></div>`:`<div class="sub">Esta tarjeta no tiene fecha de corte configurada.</div>`);
    }else if(!sh.edit) L.push(balLine(v.a,-abs));
  }else if(T==='INGRESO'||T==='REEMBOLSO'){
    if(!sh.edit) L.push(balLine(v.a,abs)); else L.push('<span class="sub">Suma a '+esc(v.a)+'</span>');
  }else if(T==='TRANSFERENCIA'&&!sh.edit){
    if(v.a===v.a2) L.push('<div class="sub neg">Elige dos cuentas distintas.</div>'); else L.push(balLine(v.a,-abs)+balLine(v.a2,abs));
  }else if(T==='PAGO'){
    L.push(balLine(v.a,-abs)+`<div class="sub">Paga ${esc(v.card)}. No cuenta como gasto del mes.</div>`);
  }
  if(T!=='TRANSFERENCIA'&&T!=='PAGO'){
    const dup=S.reg.find(r=>r.id!==sh.id&&r.f===v.f&&r.a===v.a&&r.c===v.c&&Math.abs(Math.abs(r.m)-abs)<0.005);
    if(dup) L.push('<div class="warnline">Ya hay un movimiento igual ese día. Guárdalo solo si es otro.</div>');
  }

}

const CLR_SKIP=/^(date|hidden|checkbox|radio|range|color|file|submit|button)$/;
function addClears(root){
  (root||document).querySelectorAll('input:not([data-clr])').forEach(i=>{
    if(CLR_SKIP.test(i.type)||i.readOnly||i.disabled||i.dataset.noclr) return;
    i.dataset.clr='1'; if(!i.placeholder) i.placeholder=' ';
    const w=document.createElement('span'); w.className='clrw'; i.parentNode.insertBefore(w,i); w.appendChild(i);
    const b=document.createElement('button'); b.type='button'; b.className='clr'; b.tabIndex=-1; b.setAttribute('aria-label','Borrar'); b.innerHTML='<span>✕</span>';
    w.appendChild(b);
  });
}
document.addEventListener('pointerdown',e=>{ if(e.target.closest('.clr')) e.preventDefault() });
document.addEventListener('click',e=>{
  const b=e.target.closest('.clr'); if(!b) return; e.preventDefault(); e.stopPropagation();
  const i=b.parentNode.querySelector('input'); if(!i) return;
  i.value=''; i.focus(); i.dispatchEvent(new Event('input',{bubbles:true})); i.dispatchEvent(new Event('change',{bubbles:true}));
},true);

/* ---------- plan del mes: ingresos fijos, gastos fijos, MSI y día a día ---------- */
const DEF_ING=[];
const DEF_FIJ=[];
const PLAN_DESDE='2026-09';
function ensurePlan(s){
  if(!Array.isArray(s.ing)) s.ing=clone(DEF_ING);
  if(!Array.isArray(s.fijos)) s.fijos=clone(DEF_FIJ);
  if(typeof s.metaPct!=='number') s.metaPct=0.10;
  (s.msi||[]).forEach((m,i)=>{if(!m.id)m.id='m'+i});
  (s.reg||[]).forEach((r,i)=>{if(r.ts==null)r.ts=i});
  if((s.planV||0)<2){
    const i1=s.ing.find(x=>x.id==='i1'); if(i1&&!i1.finde) i1.finde='antes';
    const sat=DEF_FIJ.find(f=>f.id==='f12'); if(sat&&!s.fijos.some(f=>f.c==='SAT')) s.fijos.push(clone(sat));
    s.planV=2;
  }
  if((s.planV||0)<3){
    s.ing.forEach(x=>{ if((x.id==='i3'||x.id==='i4')&&x.freq==='mensual'){ x.freq='cada28'; x.ancla='2026-10-08'; delete x.dia } });
    s.planV=3;
  }
  return s;
}
ensurePlan(S);

const FREQ=[['mensual','Cada mes'],['catorcenal','Cada 14 días'],['cada28','Cada 4 semanas'],['quincenal','Quincenal'],['anual','Una vez al año'],['manual','Sin fecha fija']];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const dim=(y,m)=>new Date(y,m+1,0).getDate();
function occ(it,y,m){
  if(it.desde&&new Date(y,m+1,0)<parse(it.desde)) return [];
  const n=dim(y,m), D=d=>new Date(y,m,Math.min(Math.max(1,d|0),n));
  if(it.freq==='mensual'){ const d=D(it.dia||1); if(it.finde==='antes'){const w=d.getDay(); if(w===6) d.setDate(d.getDate()-1); if(w===0) d.setDate(d.getDate()-2)} return [d] }
  if(it.freq==='quincenal') return [D(15),D(n)];
  if(it.freq==='anual') return (it.mes-1)===m?[D(it.dia||1)]:[];
  if(it.freq==='manual') return [null];
  const step=it.freq==='catorcenal'?14:it.freq==='cada28'?28:0;
  if(step&&it.ancla){
    const a=parse(it.ancla), start=new Date(y,m,1), out=[];
    let k=Math.ceil((start-a)/864e5/step);
    for(;;k++){const d=new Date(a.getFullYear(),a.getMonth(),a.getDate()+step*k); if(d.getMonth()!==m||d.getFullYear()!==y){ if(d>start) break; else continue } out.push(d)}
    return out;
  }
  return [];
}
const same=(d,y,m)=>d.getFullYear()===y&&d.getMonth()===m;
const isAmb=t=>t==='AMBOS';
function isVales(acc){ if(!acc) return false; const d=S.deb.find(x=>x.n===acc); return !!(d&&d.vales)||/^VALES\b/i.test(acc) }
const valesLabel=a=>cap(String(a).replace(/^VALES\s*/i,''))||'Vales';
function split(v,who){return who==='RAFA'?[v,0]:who==='REBE'?[0,v]:[v/2,v/2]}

function occP(it,p){
  if(it.freq==='manual') return (it.desde&&p.end<parse(it.desde))?[]:[null];
  const seen=new Set(), out=[];
  for(const d of [...occ(it,p.start.getFullYear(),p.start.getMonth()),...occ(it,p.end.getFullYear(),p.end.getMonth())]){
    if(!d||d<p.start||d>p.end||seen.has(+d)) continue; seen.add(+d); out.push(d) }
  return out;
}
function fijoFecha(f,p){ const b=(f.dia||1)>CORTE?p.start:p.end; return new Date(b.getFullYear(),b.getMonth(),Math.min(f.dia||1,dim(b.getFullYear(),b.getMonth()))) }
function msiCargo(x,i,k){
  const pay=addM(i.first,k), card=S.cre.find(c=>c.n===x.t);
  if(card&&card.corte&&card.pago) return new Date(pay.getFullYear(),pay.getMonth()-(card.pago>card.corte?0:1),card.corte);
  return pay;
}
function monthPlan(y,m){
  const per=periodo(y,m), pa=ymd(per.start), pb=ymd(per.end), key=y+'-'+pad(m+1), rows=S.reg.filter(r=>r.f>=pa&&r.f<=pb);
  const inP=d=>d>=per.start&&d<=per.end;
  const used=new Set(); const P={y,m,key,ing:[],otros:[],rend:[],fij:[],msi:[],vars:[],reem:[],valIn:[],valOtros:[],valG:[],rafa:{ing:0,gas:0},rebe:{ing:0,gas:0}};
  const addP=(arr,kind)=>{P.rafa[kind]+=arr[0];P.rebe[kind]+=arr[1]};
  // ingresos fijos (primero los normales, luego los extra)
  const items=[...S.ing].sort((a,b)=>(a.freq==='anual')-(b.freq==='anual'));
  for(const it of items){
    const oc=occP(it,per).sort((a,b)=>(a&&b)?a-b:0);
    const rec=rows.filter(r=>r.t==='INGRESO'&&!used.has(r)&&r.c===it.c&&(r.a===it.cuenta||titular(r.a)===it.quien||isAmb(titular(r.a))));
    if(!oc.length&&!rec.length) continue;
    rec.forEach(r=>used.add(r));
    const pend=oc.slice(rec.length);
    const total=rec.reduce((t,r)=>t+r.m,0)+pend.length*it.m;
    if(isVales(it.cuenta)){ P.valIn.push({it,rec,pend,total}); continue }
    P.ing.push({it,rec,pend,total,extra:it.freq==='anual'}); addP(split(total,it.quien),'ing');
  }
  for(const r of rows){ if(r.t==='INGRESO'&&!used.has(r)){ if(isVales(r.a)){P.valOtros.push(r);continue} if(esInteres(r)){P.rend.push(r);continue} P.otros.push(r); addP(split(r.m,titular(r.a)),'ing')} }
  // gastos fijos
  const fset=new Set(S.fijos.map(f=>f.c));
  for(const f of S.fijos){
    if(f.desde&&per.end<parse(f.desde)) continue;
    const ft=titular(f.cuenta);
    const paid=rows.filter(r=>r.t==='GASTO'&&r.c===f.c&&(isAmb(ft)||titular(r.a)===ft||r.a===f.cuenta));
    const amt=paid.length?paid.reduce((t,r)=>t+r.m,0):f.m;
    P.fij.push({f,paid,amt,date:fijoFecha(f,per)});
    {const pr=typeof f.pr==='number'?f.pr:S.pctCasa; addP(f.s==='NO'?split(amt,ft):[amt*pr,amt*(1-pr)],'gas');}
  }
  // MSI con mensualidad en este mes
  for(const x of S.msi){ const i=msiInfo(x);
    for(let k=0;k<x.meses;k++){ const d=msiCargo(x,i,k); if(inP(d)){P.msi.push({x,i,n:k+1,date:d}); addP([i.rafa,i.rebe],'gas'); break} } }
  // día a día
  for(const r of rows){
    if(r.t==='GASTO'&&!fset.has(r.c)&&!PAGO_CATS.includes(r.k)){ if(isVales(r.a)){P.valG.push(r);continue} P.vars.push(r); addP(parts(r),'gas')}
    if(r.t==='REEMBOLSO'&&!fset.has(r.c)){P.reem.push(r); const s=split(r.m,titular(r.a)); P.rafa.gas-=s[0]; P.rebe.gas-=s[1]}
  }
  const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
  P.tIng=sum(P.ing,x=>x.total)+sum(P.otros,r=>r.m);
  P.tIngRec=sum(P.ing,x=>x.rec.reduce((t,r)=>t+r.m,0))+sum(P.otros,r=>r.m);
  P.tFij=sum(P.fij,x=>x.amt);
  P.tMsi=sum(P.msi,x=>x.i.mens);
  P.tVar=sum(P.vars,r=>r.m)-sum(P.reem,r=>r.m);
  P.tValG=sum(P.valG,r=>r.m);
  P.meta=P.tIng*S.metaPct;
  P.res=P.tIng-P.tFij-P.tMsi-P.tVar;
  P.disp=P.tIng-P.tFij-P.tMsi-P.meta;
  const t=today(); P.per=per; P.cur=inP(t); P.past=per.end<t;
  P.daysLeft=P.cur?Math.round((per.end-t)/864e5)+1:0;
  return P;
}

function flowRow(label,val,cls,sign){return `<div class="fl ${cls||''}"><span>${label}</span><b>${sign||''}${money0(Math.abs(val))}</b></div>`}
function histSvg(){
  const t=today(); const pts=[]; let [yy,mm]=PLAN_DESDE.split('-').map(Number); mm--;
  while(periodo(yy,mm).end<t){ pts.push(monthPlan(yy,mm)); mm++; if(mm>11){mm=0;yy++} }
  const L=pts.slice(-6); if(!L.length) return '<div class="empty">Aún no cierra ningún periodo.</div>';
  const W=320,H=170,top=22,bot=30,mx=Math.max(1000,...L.map(p=>Math.abs(p.res)));
  const hasNeg=L.some(p=>p.res<0),hasPos=L.some(p=>p.res>0);
  const zero=hasNeg&&hasPos?top+(H-top-bot)/2:(hasNeg?top:H-bot);
  const scale=(hasNeg&&hasPos?(H-top-bot)/2:(H-top-bot))/mx;
  const bw=Math.min(48,(W-20)/L.length-14), step=(W-20)/L.length;
  const bars=L.map((p,i)=>{const x=10+step*i+(step-bw)/2,h=Math.max(2,Math.abs(p.res)*scale),yb=p.res>=0?zero-h:zero;
    const lab=new Date(p.y,p.m,1).toLocaleDateString('es-MX',{month:'short'}).replace('.','');
    const vy=p.res>=0?yb-6:yb+h+13;
    return `<rect x="${x}" y="${yb}" width="${bw}" height="${h}" rx="4" fill="${p.res>=0?'var(--good)':'var(--bad)'}" opacity="${p.cur?.5:1}"/>
    <text x="${x+bw/2}" y="${vy}" text-anchor="middle" class="sv">${(p.res<0?'−':'+')+Math.round(Math.abs(p.res)/100)/10+'k'}</text>
    <text x="${x+bw/2}" y="${H-8}" text-anchor="middle" class="sl">${lab}${p.cur?'*':''}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="hist" role="img" aria-label="Lo que sobró o faltó cada periodo"><line x1="6" x2="${W-6}" y1="${zero}" y2="${zero}" class="z"/>${bars}</svg>`;
}

function saveIng(){

  const dia=parseInt(d.dia,10);
  if((d.freq==='mensual'||d.freq==='anual')&&!(dia>=1&&dia<=31)){toast('Escribe un día entre 1 y 31');return}
  if((d.freq==='catorcenal'||d.freq==='cada28')&&!d.ancla){toast('Elige la fecha de un pago');return}
  const o={id:d.id||('i'+Date.now()),c:d.c,k:d.k||d.c,quien:d.quien,m,freq:d.freq,cuenta:d.cuenta};
  if(d.desde) o.desde=d.desde; else if(!ui.sheet.edit) o.desde=ymd(periodo(ui.y,ui.m).start);
  if(d.freq==='mensual'){o.dia=dia; if(d.finde==='antes') o.finde='antes'} if(d.freq==='anual'){o.dia=dia;o.mes=+d.mes;o.k='EXTRA'} if(d.freq==='catorcenal'||d.freq==='cada28') o.ancla=d.ancla;

}

/* ---------- rendimientos: lo que ganan las cuentas por tener dinero ---------- */
const esInteres=r=>r.t==='INGRESO'&&/^(INTERES|RENDIMIENTO)/.test(r.c||'');
const nextDay=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
// Saldo de cada día desde el último interés registrado, por la tasa anual / 365, con interés diario compuesto.
function rendSerie(acc){
  if(!(acc.tasa>0)) return null;
  const movs=S.reg.filter(r=>r.a===acc.n).sort((a,b)=>a.f.localeCompare(b.f));
  const ints=movs.filter(esInteres), last=ints.length?ints[ints.length-1].f:null;
  let d0=last?nextDay(parse(last)):null; const td=acc.tasaDesde?parse(acc.tasaDesde):null;
  if(td&&(!d0||td>d0)) d0=td; if(!d0) return null;
  const t=today(), end=new Date(t.getFullYear(),t.getMonth(),t.getDate()-1), ds=ymd(d0), r1=acc.tasa/100/365, r2=(acc.tasa2||0)/100/365, tope=acc.tope>0?acc.tope:Infinity;
  const mv=r=>r.t==='GASTO'?-r.m:r.m;
  let bal=acc.ini||0, i=0, tot=0; const days=[];
  for(;i<movs.length&&movs[i].f<ds;i++) bal+=mv(movs[i]);
  for(let d=d0; d<=end; d=nextDay(d)){
    const k=ymd(d); for(;i<movs.length&&movs[i].f<=k;i++) bal+=mv(movs[i]);
    const b=Math.max(0,bal), g=Math.min(b,tope)*r1+Math.max(0,b-tope)*r2; bal+=g; tot+=g; days.push([k,g]);
  }
  return {acc,desde:ds,last,days,tot};
}
// En qué apartado está el dinero: lo primero llena el apartado con tope y el resto queda en el segundo.
function apartados(acc,saldo){
  if(!(acc.tasa>0)&&!acc.nom1) return [];
  const b=Math.max(0,saldo), n1=acc.nom1||(acc.tope>0?'Al '+acc.tasa+'%':''), n2=acc.nom2||('Al '+(acc.tasa2||0)+'%');
  if(!(acc.tope>0)) return n1?[{n:n1,m:b,t:acc.tasa||0}]:[];
  const L=[{n:n1,m:Math.min(b,acc.tope),t:acc.tasa||0,lleno:b>=acc.tope}]; if(b>acc.tope) L.push({n:n2,m:b-acc.tope,t:acc.tasa2||0}); return L;
}
const rendTodas=()=>S.deb.map(rendSerie).filter(Boolean);
const tasaTxt=a=>a.tope>0?`${a.tasa}% hasta ${money0(a.tope)} y ${a.tasa2||0}% arriba`:`${a.tasa}% anual`;
function rendPeriodo(P){
  const a=ymd(P.per.start), b=ymd(P.per.end);
  const est=rendTodas().map(x=>({acc:x.acc,m:x.days.filter(([k])=>k>=a&&k<=b).reduce((t,[,g])=>t+g,0),tot:x.tot,desde:x.desde})).filter(x=>x.m>0.005);
  return {reg:P.rend, est, tReg:P.rend.reduce((t,r)=>t+r.m,0), tEst:est.reduce((t,x)=>t+x.m,0)};
}

/* ---------- cuentas claras: quién le paga a quién en el periodo ---------- */
const otro=w=>w==='RAFA'?'REBE':'RAFA';
const esPersona=w=>w==='RAFA'||w==='REBE';
function claras(P){
  const per=P.per, a=ymd(per.start), b=ymd(per.end), rows=S.reg.filter(r=>r.f>=a&&r.f<=b);
  const R={debeRafa:[],debeRebe:[],pagos:[]};
  // payer pagó algo; al otro le toca su parte
  const add=(payer,f,c,total,sh,tipo)=>{
    if(!esPersona(payer)) return;
    const parte=payer==='RAFA'?sh[1]:sh[0]; if(!(parte>0.005)) return;
    (payer==='RAFA'?R.debeRebe:R.debeRafa).push({f,c,total,parte,tipo});
  };
  for(const r of P.vars) add(titular(r.a),r.f,r.c,r.m,parts(r),'gasto');
  const usados=new Set();
  for(const x of P.fij){ const ft=titular(x.f.cuenta), pr=typeof x.f.pr==='number'?x.f.pr:S.pctCasa;
    for(const r of x.paid){ usados.add(r); add(titular(r.a),r.f,x.f.c,r.m,x.f.s==='NO'?split(r.m,ft):[r.m*pr,r.m*(1-pr)],'fijo') } }
  for(const x of P.msi) add(titular(x.x.t),ymd(x.date),cap(x.x.c)+' '+x.n+'/'+x.x.meses,x.i.mens,[x.i.rafa,x.i.rebe],'msi');
  // ingresos de uno que le llegaron a la cuenta del otro (ej. lo de Bere)
  for(const x of P.ing){ if(!esPersona(x.it.quien)) continue;
    for(const r of x.rec){ const h=titular(r.a); if(esPersona(h)&&h!==x.it.quien)
      (h==='RAFA'?R.debeRafa:R.debeRebe).push({f:r.f,c:cap(x.it.c)+' (le llegó a '+cap(h)+')',total:r.m,parte:r.m,tipo:'ingreso'}) } }
  // pagos entre ustedes
  const fset=new Set(S.fijos.map(f=>f.c));
  const reemC=new Set(rows.filter(r=>r.t==='REEMBOLSO'&&fset.has(r.c)).map(r=>r.c));
  for(const r of rows){
    if(r.t==='REEMBOLSO'&&fset.has(r.c)){ const to=titular(r.a); if(esPersona(to)) R.pagos.push({f:r.f,de:otro(to),a:to,m:r.m,c:cap(r.c)}) }
    if(r.t==='GASTO'&&fset.has(r.c)&&!usados.has(r)&&!reemC.has(r.c)){ const from=titular(r.a); const f=S.fijos.find(x=>x.c===r.c); const to=f?titular(f.cuenta):otro(from);
      if(esPersona(from)&&esPersona(to)&&from!==to) R.pagos.push({f:r.f,de:from,a:to,m:r.m,c:cap(r.c)}) }
    if(r.t==='TRANSFERENCIA'&&r.m>0){ const to=titular(r.a); if(!esPersona(to)) continue;
      const par=rows.find(q=>q.t==='TRANSFERENCIA'&&q.m<0&&q.f===r.f&&Math.abs(q.m+r.m)<0.01&&esPersona(titular(q.a))&&titular(q.a)!==to);
      if(par) R.pagos.push({f:r.f,de:titular(par.a),a:to,m:r.m,c:'Transferencia'}) }
  }
  const sum=l=>l.reduce((t,x)=>t+(x.parte!=null?x.parte:x.m),0);
  R.tRafa=sum(R.debeRafa); R.tRebe=sum(R.debeRebe);
  R.pRafa=sum(R.pagos.filter(p=>p.de==='RAFA')); R.pRebe=sum(R.pagos.filter(p=>p.de==='REBE'));
  R.neto=(R.tRafa-R.pRafa)-(R.tRebe-R.pRebe); // >0: Rafa le pasa a Rebe
  return R;
}
function vClaras(){
  const P=monthPlan(ui.y,ui.m), R=claras(P), n=Math.round(R.neto*100)/100;
  const quien=n>0?'RAFA':'REBE', abs=Math.abs(n);
  const lista=(l,vacio)=>l.length?`<div class="list">${[...l].sort((x,y)=>x.f.localeCompare(y.f)).map(x=>`<div class="item"><div class="main"><b>${esc(x.tipo==='gasto'||x.tipo==='fijo'?cap(x.c):x.c)}</b><span class="sub">${fmtDay(parse(x.f))}${x.tipo==='ingreso'?'':' · total '+money0(x.total)}${x.tipo==='msi'?' · MSI':x.tipo==='fijo'?' · fijo':''}</span></div><span class="amt">${money(x.parte)}</span></div>`).join('')}</div>`:`<div class="empty">${vacio}</div>`;
  const pagos=R.pagos.length?`<div class="list">${R.pagos.map(p=>`<div class="item"><div class="main"><b>${cap(p.de)} → ${cap(p.a)}</b><span class="sub">${fmtDay(parse(p.f))} · ${esc(p.c)}</span></div><span class="amt">${money(p.m)}</span></div>`).join('')}</div>`:'<div class="empty">Aún no se han pasado dinero en este periodo.</div>';
  return `<div class="wrap">${monthNav('Cuentas claras')}
  <section class="card hero"><span class="sub">${P.past?'Al cerrar el periodo':'Hasta hoy, en este periodo'} ${infoI('claras')}</span>
    <div class="big">${abs<1?'Están a mano':money0(abs)}</div>
    ${abs<1?'':`<span class="sub" style="font-size:16px;font-weight:600;color:var(--ink)">${cap(quien)} le pasa a ${cap(otro(quien))}</span>`}
    <div class="flow">
      ${flowRow('Rafa le debe a Rebe',R.tRafa,'','')}
      ${R.pRafa?flowRow('Rafa ya le pasó',R.pRafa,'','−'):''}
      ${flowRow('Rebe le debe a Rafa',R.tRebe,'','')}
      ${R.pRebe?flowRow('Rebe ya le pasó',R.pRebe,'','−'):''}
    </div>
    ${abs>=1?`<button class="btn" data-a="saldar" data-de="${quien}" data-m="${abs.toFixed(2)}">Registrar que ${cap(quien)} pagó ${money0(abs)}</button>`:''}
  </section>
  <section class="card"><div class="hd"><h2>Pagó Rebe, le toca a Rafa ${infoI('claras-rebe')}</h2><b>${money0(R.tRafa)}</b></div>${lista(R.debeRafa,'Nada en este periodo.')}</section>
  <section class="card"><div class="hd"><h2>Pagó Rafa, le toca a Rebe ${infoI('claras-rafa')}</h2><b>${money0(R.tRebe)}</b></div>${lista(R.debeRebe,'Nada en este periodo.')}</section>
  <section class="card"><div class="hd"><h2>Pagos entre ustedes ${infoI('claras-pagos')}</h2><b>${money0(R.pRafa+R.pRebe)}</b></div>${pagos}</section>
  </div>`;
}

const CFG_KEYS=['deb','cre','casa','pctCasa','pctShared','metaPct','planV'];
const COLMAP={movs:'reg',msi:'msi',ing:'ing',fijos:'fijos'};
let DB=null, mode='local', canWrite=true, syncNote='';
const synced={movs:new Map(),msi:new Map(),ing:new Map(),fijos:new Map(),cfg:null};
const got={movs:false,msi:false,ing:false,fijos:false,cfg:false};
let cfgExists=false, writeQ=Promise.resolve(), connectTimer=null, rq=0;
function stable(v){ if(Array.isArray(v)) return '['+v.map(stable).join(',')+']';
  if(v&&typeof v==='object') return '{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';
  return JSON.stringify(v===undefined?null:v) }
function cfgOf(s){const o={};CFG_KEYS.forEach(k=>{if(s[k]!==undefined)o[k]=s[k]});return o}
function body(x){const c=clone(x); delete c.id; return c}
const allGot=()=>Object.values(got).every(Boolean);
function dataReady(){ return (mode==='local'||allGot()) && S.deb && S.deb.length>0 }
function yo(){try{return localStorage.getItem('gp-yo')||''}catch(e){return ''}}
function setYo(v){try{localStorage.setItem('gp-yo',v)}catch(e){} ui.yo=v}
ui.yo=yo();

function onWriteErr(e){
  const c=e&&e.code;
  if(c==='invalid_argument'||c==='not_granted'||c==='revoked'||c==='capability_disabled'){canWrite=false;syncNote='Solo puedes ver los datos. Para agregar, pide que te compartan la app como editor.'}
  else if(c==='quota_exceeded') syncNote='Se llenó el espacio de datos compartidos.';
  else syncNote='No se pudo guardar un cambio. Revisa tu conexión e inténtalo otra vez.';
  toast(syncNote); scheduleRender();
}
function enqueue(fn){ writeQ=writeQ.then(fn).catch(onWriteErr) }
function persistLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){memoryOnly=true}}
function persist(){
  if(mode!=='live'){ persistLocal(); return }
  if(!canWrite){ toast('Solo puedes ver: no tienes permiso para guardar'); return }
  for(const [col,arr] of Object.entries(COLMAP)){
    const cur=new Map(S[arr].map(x=>[x.id,stable(body(x))]));
    for(const [id,js] of cur){ if(synced[col].get(id)!==js){ synced[col].set(id,js); const b=JSON.parse(js); enqueue(()=>DB.collection(col).doc(id).set(b)) } }
    for(const id of [...synced[col].keys()]){ if(!cur.has(id)){ synced[col].delete(id); enqueue(()=>DB.collection(col).doc(id).delete()) } }
  }
  const cj=stable(cfgOf(S)); if(synced.cfg!==cj){ synced.cfg=cj; const b=JSON.parse(cj); enqueue(()=>DB.doc('config/main').set(b)) }
}
function scheduleRender(){ if(rq) return; rq=requestAnimationFrame(()=>{rq=0; render()}) }
function applySnap(col,snap){
  const arr=snap.docs.map(d=>Object.assign(clone(d.data()),{id:d.id}));
  if(col==='movs') arr.sort((a,b)=>a.f.localeCompare(b.f)||(a.ts||0)-(b.ts||0)||String(a.id).localeCompare(String(b.id)));
  if(col==='msi') arr.sort((a,b)=>String(a.f).localeCompare(String(b.f)));
  S[COLMAP[col]]=arr; synced[col]=new Map(arr.map(x=>[x.id,stable(body(x))]));
  got[col]=true; afterSnap();
}
function afterSnap(){
  if(allGot()){ if(connectTimer){clearTimeout(connectTimer);connectTimer=null} if(mode==='connecting'){mode='live'; checkLocalOnly()} if(!/permiso|editor/.test(syncNote)) syncNote='' }
  scheduleRender();
}
function snapErr(e){ if(e&&e.code==='revoked'){canWrite=false} syncNote='Se perdió la conexión con los datos compartidos. Cierra y vuelve a abrir la app.'; scheduleRender() }
/* Lo que este teléfono tenía guardado antes de compartir */
function checkLocalOnly(){
  let local=null, done=false;
  try{ done=localStorage.getItem('gp-subido')==='1'; const raw=localStorage.getItem(KEY); local=raw?JSON.parse(raw):null }catch(e){}
  if(done||!local||!Array.isArray(local.reg)) return;
  const reg=local.reg.filter(r=>r&&r.id&&!synced.movs.has(r.id));
  const msi=(local.msi||[]).filter(m=>!S.msi.some(x=>x.c===m.c&&x.f===m.f&&x.t===m.t));
  if(reg.length||msi.length) ui.pendUp={reg,msi}; else { try{localStorage.setItem('gp-subido','1')}catch(e){} }
}
function uploadLocal(){
  const p=ui.pendUp; if(!p) return; let t=Date.now();
  p.reg.forEach(r=>{ if(!S.reg.some(x=>x.id===r.id)) S.reg.push(Object.assign(clone(r),{ts:t++})) });
  p.msi.forEach(m=>S.msi.push(Object.assign(clone(m),{id:'m'+(t++)})));
  S.reg.sort((a,b)=>a.f.localeCompare(b.f)||(a.ts||0)-(b.ts||0));
  persist(); ui.pendUp=null; try{localStorage.setItem('gp-subido','1')}catch(e){}
  render(); toast('Listo, ya están en los datos compartidos');
}
async function startSync(){
  const c=window.claude; if(!c||typeof c.use!=='function'){ render(); return }
  mode='connecting'; render();
  connectTimer=setTimeout(()=>{ if(mode==='connecting'){ syncNote='Todavía no se pueden leer los datos compartidos. Revisa tu conexión.'; scheduleRender() } },10000);
  let db=null; try{ db=await c.use('db') }catch(e){ db=null }
  if(!db){ mode='local'; clearTimeout(connectTimer); syncNote=''; render(); return }
  DB=db;
  for(const col of Object.keys(COLMAP)) DB.collection(col).onSnapshot(s=>applySnap(col,s),snapErr);
  DB.doc('config/main').onSnapshot(s=>{ cfgExists=s.exists; if(s.exists){ Object.assign(S,clone(s.data())); synced.cfg=stable(cfgOf(S)) } got.cfg=true; afterSnap() },snapErr);
}

const GP=window.GP_CONFIG||{};
const pa={sb:null,user:null,hogar:null,codigo:'',nombreHogar:'',screen:'boot',busy:false,err:'',loginMode:'entrar',adapter:null};
function cfgVal(){
  let url=GP.url||'',key=GP.key||'';
  if(!/^https:\/\/.+supabase\.co/.test(url)||key.length<20){ try{const o=JSON.parse(localStorage.getItem('gp-config')||'{}'); url=o.url||url; key=o.key||key}catch(e){} }
  return (/^https:\/\//.test(url)&&key.length>20)?{url,key}:null;
}
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

function makeDb(sb,hogar){
  const KC='gp-cache-'+hogar, KP='gp-pend-'+hogar;
  let cache=lsGet(KC)||{}, pend=lsGet(KP)||{}, loaded=!!cache.__ok, flushing=null;
  const L={}, DL={};
  const docsOf=col=>Object.entries(cache[col]||{}).map(([id,d])=>({id,exists:true,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}}));
  function emit(col){
    const docs=docsOf(col);
    (L[col]||[]).forEach(f=>f({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false},docChanges:()=>[]}));
    Object.keys(DL).filter(p=>p.startsWith(col+'/')).forEach(p=>{const id=p.slice(col.length+1),d=(cache[col]||{})[id];
      DL[p].forEach(f=>f({id,exists:!!d,data:()=>d,metadata:{fromCache:false}}))});
  }
  const emitAll=()=>{ new Set([...Object.keys(L),...Object.keys(DL).map(p=>p.split('/')[0])]).forEach(emit) };
  const saveC=()=>lsSet(KC,cache), saveP=()=>lsSet(KP,pend);
  function applyLocal(col,id,data){ cache[col]=cache[col]||{}; if(data==null) delete cache[col][id]; else cache[col][id]=data; saveC(); emit(col) }
  async function flush(){
    if(flushing) return flushing;
    flushing=(async()=>{
      for(const k of Object.keys(pend)){
        const p=pend[k], i=k.indexOf('/'), col=k.slice(0,i), id=k.slice(i+1);
        const r=p.op==='set'?await sb.from('docs').upsert({hogar_id:hogar,col,id,data:p.data,updated_at:new Date().toISOString()})
                            :await sb.from('docs').delete().match({hogar_id:hogar,col,id});
        if(r.error){ api.offline=true; break }
        if(pend[k]===p){ delete pend[k]; saveP() }
      }
      if(!Object.keys(pend).length) api.offline=false;
      api.onStatus&&api.onStatus();
    })().catch(()=>{api.offline=true; api.onStatus&&api.onStatus()}).finally(()=>{flushing=null});
    return flushing;
  }
  async function load(){
    const fresh={}; let from=0;
    for(;;){
      const {data,error}=await sb.from('docs').select('col,id,data').eq('hogar_id',hogar).order('col').order('id').range(from,from+999);
      if(error) throw error;
      data.forEach(r=>{(fresh[r.col]=fresh[r.col]||{})[r.id]=r.data});
      if(data.length<1000) break; from+=1000;
    }
    for(const [k,p] of Object.entries(pend)){ const i=k.indexOf('/'),col=k.slice(0,i),id=k.slice(i+1); fresh[col]=fresh[col]||{}; if(p.op==='set') fresh[col][id]=p.data; else delete fresh[col][id] }
    fresh.__ok=true; cache=fresh; loaded=true; saveC(); emitAll();
  }
  function onChange(pl){
    const n=pl.new&&pl.new.col?pl.new:null, o=pl.old&&pl.old.col?pl.old:null, r=n||o; if(!r||r.hogar_id!==hogar) return;
    if(pend[r.col+'/'+r.id]) return;
    applyLocal(r.col,r.id,pl.eventType==='DELETE'?null:n.data);
  }
  sb.channel('docs-'+hogar)
    .on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'hogar_id=eq.'+hogar},onChange)
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'docs'},onChange)
    .subscribe();
  const refresh=()=>flush().then(load).catch(()=>{api.offline=true; api.onStatus&&api.onStatus()});
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') refresh() });
  window.addEventListener('online',refresh);
  function ref(col,id){ const path=col+'/'+id; return {id,path,
    set:d=>{ pend[path]={op:'set',data:JSON.parse(JSON.stringify(d))}; saveP(); applyLocal(col,id,pend[path].data); flush(); return Promise.resolve() },
    delete:()=>{ pend[path]={op:'del'}; saveP(); applyLocal(col,id,null); flush(); return Promise.resolve() },
    onSnapshot:(n)=>{ (DL[path]=DL[path]||[]).push(n); if(loaded) setTimeout(()=>emit(col),0); return ()=>{} } } }
  const api={offline:false,onStatus:null,pending:()=>Object.keys(pend).length,refresh,
    doc:p=>{const i=p.indexOf('/'); return ref(p.slice(0,i),p.slice(i+1))},
    collection:c=>({path:c,doc:id=>ref(c,id),onSnapshot:(n)=>{(L[c]=L[c]||[]).push(n); if(loaded) setTimeout(()=>emit(c),0); return ()=>{}}})};
  refresh();
  return api;
}

async function startSync(){

  pa.sb=supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'gp-auth'}});

  connectData();

  DB.doc('config/main').onSnapshot(s=>{ cfgExists=s.exists; if(s.exists){ Object.assign(S,clone(s.data())); synced.cfg=stable(cfgOf(S)) } got.cfg=true; afterSnap() },snapErr);
  render();
}

  try{ const blob=new Blob([data],{type:'application/json'}); const f=new File([blob],'gastos-pareja-'+ymd(today())+'.json',{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:'Respaldo Gastos Pareja'}); return }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=f.name; document.body.appendChild(a); a.click(); a.remove(); toast('Respaldo listo');
  }catch(e){ if(e&&e.name==='AbortError') return; toast('No se pudo guardar. Usa Copiar respaldo') }
}
const authMsg=m=>/Invalid login/i.test(m)?'Correo o contraseña incorrectos.':/already registered/i.test(m)?'Ese correo ya tiene cuenta. Usa “Ya tengo cuenta”.':/Password should be/i.test(m)?'La contraseña debe tener al menos 6 caracteres.':/Email not confirmed/i.test(m)?'Confirma tu correo con el enlace que te llegó y vuelve a entrar.':/Failed to fetch|network/i.test(m)?'Sin conexión. Revisa tu internet.':m;
document.addEventListener('submit',async e=>{
  if(e.target.id!=='lf') return; e.preventDefault(); e.stopImmediatePropagation();
  const email=$('#le').value.trim(), pass=$('#lp').value; pa.email=email;
  if(!/^\S+@\S+\.\S+$/.test(email)){ pa.err='Escribe un correo válido.'; render(); return }
  if(pass.length<6){ pa.err='La contraseña debe tener al menos 6 caracteres.'; render(); return }
  pa.busy=true; pa.err=''; render();
  try{
    const r=pa.loginMode==='crear'?await pa.sb.auth.signUp({email,password:pass}):await pa.sb.auth.signInWithPassword({email,password:pass});
    if(r.error) throw r.error;
    if(!r.data.session){ pa.busy=false; pa.loginMode='entrar'; pa.err='Te mandamos un correo para confirmar tu cuenta. Confírmalo y luego entra aquí.'; render(); return }
    pa.user=r.data.session.user; pa.busy=false; await pickHogar();
  }catch(err){ pa.busy=false; pa.err=authMsg(err.message||String(err)); render() }
},true);
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]'); if(!el) return; const a=el.dataset.a;
  if(a==='pcfg'){ const url=$('#cu').value.trim().replace(/\/rest\/v1\/?$/,'').replace(/\/+$/,''), key=$('#ck').value.trim(); if(!/^https:\/\/.+/.test(url)||key.length<20){toast('Revisa la URL y la clave');return} lsSet('gp-config',{url,key}); startSync(); return }
  if(a==='lmode'){ pa.loginMode=el.dataset.v; pa.err=''; render(); return }
  if(a==='reint'){ location.reload(); return }
  if(a==='salir'){ try{ await pa.sb.auth.signOut() }catch(x){} ['gp-hogar'].forEach(k=>{try{localStorage.removeItem(k)}catch(x){}}); location.reload(); return }
  if(a==='hcrear'||a==='hunir'){
    pa.busy=true; pa.err=''; const nombre=($('#hn')||{}).value||'', cod=(($('#hc')||{}).value||'').trim();
    if(a==='hunir'&&cod.length!==6){ pa.busy=false; pa.err='El código tiene 6 caracteres.'; render(); return }
    render();
    const r=a==='hcrear'?await pa.sb.rpc('crear_hogar',{p_nombre:nombre}):await pa.sb.rpc('unirse_hogar',{p_codigo:cod});
    pa.busy=false;
    if(r.error){ pa.err=/no encontrado/i.test(r.error.message)?'No encontramos ese código. Revísalo con tu pareja.':authMsg(r.error.message); render(); return }
    try{localStorage.removeItem('gp-hogar')}catch(x){}
    await pickHogar(); return }
});
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});

startSync();
